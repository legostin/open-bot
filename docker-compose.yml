# docker compose up -d --build   →  http://localhost:8080 (chat) and http://localhost:8081 (security console)
services:
  piomio:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: piomio:latest
    container_name: piomio
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:8081:8081"
    volumes:
      - piomio-data:/data
    environment:
      PIOMIO_PUBLIC_URL: http://localhost:8080
      # PIOMIO_CONSOLE_URL: http://localhost:8081
      # PIOMIO_ALLOWED_HOSTS: my-box.tailnet.ts.net
      # Hard egress enforcement for agent/plugin users (needs cap_add NET_ADMIN below):
      # PIOMIO_EGRESS_ENFORCED: iptables
      # TZ: Europe/Moscow
      # Hub language (en or ru); by default it is taken from the first user's browser at setup:
      # PIOMIO_LANG: ru
    # cap_add: [NET_ADMIN]
    shm_size: 1gb
volumes:
  piomio-data: {}
