# docker compose up -d --build   →  http://localhost:8080 (chat) and http://localhost:8081 (security console)
services:
  owlbot:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: owlbot:latest
    container_name: owlbot
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:8081:8081"
    volumes:
      - owlbot-data:/data
    environment:
      OWLBOT_PUBLIC_URL: http://localhost:8080
      # OWLBOT_CONSOLE_URL: http://localhost:8081
      # OWLBOT_ALLOWED_HOSTS: my-box.tailnet.ts.net
      # Hard egress enforcement for agent/plugin users (needs cap_add NET_ADMIN below):
      # OWLBOT_EGRESS_ENFORCED: iptables
      # TZ: Europe/Moscow
      # Hub language (en or ru); by default it is taken from the first user's browser at setup:
      # OWLBOT_LANG: ru
    # cap_add: [NET_ADMIN]
    shm_size: 1gb
volumes:
  owlbot-data: {}
